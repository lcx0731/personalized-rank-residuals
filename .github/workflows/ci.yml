name: validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-repro.txt
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m rank_residuals.demo --output /tmp/rank-demo
      - run: rank-residuals rank /tmp/rank-demo/example.json
      - run: rank-residuals verify /tmp/rank-demo/verification.json
